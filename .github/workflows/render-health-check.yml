name: Render Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 https://cv-shortlisting-system-2.onrender.com/api/health
